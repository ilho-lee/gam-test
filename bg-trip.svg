<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- 여행지 주제의 바탕 무늬: 비행기 · 여행가방 · 지도 핀 · 나침반 · 여권 도장 · 도리이 · 산 -->
  <!-- 비행기 -->
  <g transform="translate(40 40) rotate(-20)" fill="#9cc3ea">
    <path d="M0 10 L60 6 Q70 10 60 14 L0 10 Z"/>
    <path d="M28 8 L16 -12 L24 -12 L42 8 Z"/>
    <path d="M28 12 L16 32 L24 32 L42 12 Z"/>
    <path d="M2 9 L-6 0 L0 0 L10 9 Z"/>
  </g>
  <!-- 여행가방 -->
  <g transform="translate(190 30)">
    <rect x="0" y="10" width="46" height="56" rx="8" fill="#f5c9a6"/>
    <rect x="14" y="0" width="18" height="12" rx="4" fill="none" stroke="#e8ac80" stroke-width="4"/>
    <rect x="10" y="20" width="4" height="36" rx="2" fill="#e8ac80"/>
    <rect x="32" y="20" width="4" height="36" rx="2" fill="#e8ac80"/>
  </g>
  <!-- 지도 핀 -->
  <g transform="translate(118 112)" fill="#f2a3a3">
    <path d="M18 0 A18 18 0 0 1 36 18 C36 32 18 50 18 50 C18 50 0 32 0 18 A18 18 0 0 1 18 0 Z"/>
    <circle cx="18" cy="18" r="7" fill="#fdf1f1"/>
  </g>
  <!-- 나침반 -->
  <g transform="translate(220 150)">
    <circle r="24" fill="none" stroke="#a7c7b4" stroke-width="4"/>
    <path d="M0 -16 L6 0 L0 16 L-6 0 Z" fill="#a7c7b4"/>
  </g>
  <!-- 여권 도장 -->
  <g transform="translate(55 175) rotate(-14)" fill="none" stroke="#b8b0e0" stroke-width="3">
    <circle r="30"/><circle r="22"/>
    <path d="M-14 -2 L14 -2 M-10 6 L10 6"/>
  </g>
  <!-- 도리이 -->
  <g transform="translate(150 215)" fill="#efb2a0">
    <rect x="6" y="10" width="6" height="40"/><rect x="38" y="10" width="6" height="40"/>
    <path d="M-6 2 Q25 -4 56 2 L56 8 Q25 3 -6 8 Z"/>
    <rect x="2" y="16" width="46" height="4"/>
  </g>
  <!-- 산 -->
  <g transform="translate(225 230)">
    <path d="M-30 30 L0 -6 L30 30 Z" fill="#b6cbe6"/>
    <path d="M0 -6 L9 5 L3 3 L-2 8 L-6 3 L-9 5 Z" fill="#eef3fa"/>
  </g>
</svg>
